<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Treino 08/2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101214;
    --surface:#1A1D21;
    --surface2:#20242A;
    --border:#2A2E33;
    --text:#EDEFF2;
    --muted:#868C96;
    --a:#FF5C4D;
    --b:#3FC1C9;
    --c:#F4B740;
    --d:#9B6BFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 8px;}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .brand{display:flex;flex-direction:column;line-height:1;}
  .brand .kicker{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600;}
  .brand h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:34px;
    letter-spacing:.03em;
    margin:2px 0 0;
  }
  .today{
    text-align:right;
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
  }
  .today b{color:var(--text);display:block;font-size:13px;text-transform:capitalize;}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
  .tab{
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:10px 6px 8px;
    text-align:center;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
    -webkit-user-select:none;user-select:none;
  }
  .tab .letter{
    font-family:'Bebas Neue',sans-serif;
    font-size:26px;
    display:block;
    line-height:1;
  }
  .tab .muscles{
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.03em;
    display:block;
    margin-top:3px;
  }
  .tab .today-dot{
    width:5px;height:5px;border-radius:50%;
    display:inline-block;margin-top:5px;
  }
  .tab[data-letter="A"] .letter{color:var(--a);}
  .tab[data-letter="B"] .letter{color:var(--b);}
  .tab[data-letter="C"] .letter{color:var(--c);}
  .tab[data-letter="D"] .letter{color:var(--d);}
  .tab.active{background:var(--surface2);border-color:var(--tab-color);transform:translateY(-1px);}
  .tab.active .today-dot{background:var(--tab-color);}

  .progress-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
  }
  .plate{position:relative;width:74px;height:74px;flex:none;}
  .plate svg{transform:rotate(-90deg);}
  .plate-label{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;
    font-size:20px;
  }
  .progress-info .pname{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.02em;}
  .progress-info .pcount{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .reset-btn{
    margin-left:auto;
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:11px;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .reset-btn:hover{border-color:var(--tab-color);color:var(--text);}

  .group{margin-bottom:16px;}
  .group-title{
    font-size:10.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin:0 0 8px 4px;
  }
  .ex{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 12px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:8px;
    transition:border-color .12s ease, opacity .12s ease;
  }
  .ex.done{opacity:.55;}
  .checkbox{
    width:24px;height:24px;flex:none;
    border-radius:7px;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .checkbox svg{width:14px;height:14px;opacity:0;transition:opacity .12s ease;}
  .ex.done .checkbox{background:var(--tab-color);border-color:var(--tab-color);}
  .ex.done .checkbox svg{opacity:1;}
  .ex-name{flex:1;min-width:0;}
  .ex-name .n{font-size:14.5px;font-weight:600;line-height:1.25;}
  .ex-name .n.done-text{text-decoration:line-through;color:var(--muted);}
  .ex-meta{
    display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;
  }
  .pill{
    font-size:10.5px;
    color:var(--muted);
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 6px;
    font-weight:600;
  }

  .aerobic-card{
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:14px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:10px;
    font-size:13px;
  }
  .aerobic-card .ic{font-size:20px;}
  .aerobic-card b{display:block;font-size:12px;}
  .aerobic-card span{color:var(--muted);font-size:12px;}

  .history{margin-top:26px;}
  .history-title{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px 4px;}
  .history-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
  .hday{
    flex:none;
    width:34px;height:44px;
    border-radius:9px;
    background:var(--surface);
    border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:10px;color:var(--muted);
  }
  .hday .dow{font-size:8.5px;text-transform:uppercase;margin-bottom:3px;}
  .hday .mark{
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:11px;color:#101214;
  }
  .hday.empty .mark{background:none;color:var(--border);font-size:9px;}

  footer{text-align:center;color:var(--muted);font-size:10.5px;margin-top:30px;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="kicker">Ficha 08/2026</span>
      <h1>TREINO</h1>
    </div>
    <div class="today">
      <b id="todayLabel">-</b>
      <span id="suggestLabel">-</span>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div class="progress-card" id="progressCard">
    <div class="plate">
      <svg width="74" height="74" viewBox="0 0 74 74">
        <circle cx="37" cy="37" r="31" fill="none" stroke="var(--border)" stroke-width="7"/>
        <circle id="progressRing" cx="37" cy="37" r="31" fill="none" stroke="var(--a)" stroke-width="7"
                stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="194.8"/>
      </svg>
      <div class="plate-label" id="progressPct">0%</div>
    </div>
    <div class="progress-info">
      <div class="pname" id="progressName">TREINO A</div>
      <div class="pcount" id="progressCount">0 de 0 concluídos</div>
    </div>
    <button class="reset-btn" id="resetBtn">desmarcar tudo</button>
  </div>

  <div id="exerciseList"></div>

  <div class="history">
    <p class="history-title">Últimos 10 dias</p>
    <div class="history-row" id="historyRow"></div>
  </div>

  <footer>salvo automaticamente neste navegador</footer>
</div>

<script>
const DATA = {
  A: {
    label: "Peito · Tríceps · Ombro · Abdômen",
    groups: [
      { title: "Peitoral", exs: [
        { n: "Peck Deck + unilateral", s: "3x", r: "5+5+10" },
        { n: "Cross Over polia baixa", s: "4x", r: "12" },
      ]},
      { title: "Tríceps", exs: [
        { n: "Tríceps no Pulley (pegada)", s: "3x", r: "12+10+8" },
        { n: "Tríceps Francês (H)", s: "3x", r: "12" },
      ]},
      { title: "Ombro", exs: [
        { n: "Desenvolvimento Arnold", s: "3x", r: "12" },
        { n: "Elevação Frontal", s: "3x", r: "10²", tag: "isometria" },
      ]},
      { title: "Abdômen", exs: [
        { n: "Romador", s: "3x", r: "12" },
        { n: "Prancha + lateral", s: "3x", r: "45s / 30s" },
      ]},
    ]
  },
  B: {
    label: "Pernas (quadríceps) · Panturrilha",
    groups: [
      { title: "Pernas", exs: [
        { n: "Agachamento Livre (barra)", s: "4x", r: "12²" },
        { n: "Afundo Alternado", s: "4x", r: "10" },
        { n: "Cadeira Extensora", s: "3x", r: "10+10", tag: "isometria" },
        { n: "Cadeira Adutora", s: "4x", r: "10+10", tag: "isometria" },
        { n: "Leg Press 45", s: "5x", r: "10 RP", tag: "intervalo 10s" },
      ]},
      { title: "Panturrilha", exs: [
        { n: "Banco Solêo", s: "4x", r: "15" },
        { n: "Panturrilha em Pé", s: "4x", r: "15" },
      ]},
    ]
  },
  C: {
    label: "Costas · Bíceps · Antebraço · Abdômen",
    groups: [
      { title: "Costas", exs: [
        { n: "Puxador Vertical (pron+sup)", s: "3x", r: "10+10" },
        { n: "Extensão de Ombro", s: "4x", r: "12" },
        { n: "Remada Sentado + unilateral", s: "3x", r: "5+5+10" },
      ]},
      { title: "Bíceps / Antebraço", exs: [
        { n: "Rosca Martelo (corda)", s: "4x", r: "12" },
        { n: "Rotação de Punho", s: "4x", r: "12" },
        { n: "Rosca Direta", s: "4x", r: "10", tag: "isometria" },
      ]},
      { title: "Abdômen", exs: [
        { n: "Abdominal Supra", s: "4x", r: "12" },
        { n: "Abdominal Infra (com H)", s: "3x", r: "12" },
      ]},
    ]
  },
  D: {
    label: "Pernas (posterior/glúteo) · Panturrilha",
    groups: [
      { title: "Glúteo / Posterior", exs: [
        { n: "Elevação de Quadril", s: "4x", r: "12²" },
        { n: "Cadeira Abdutora", s: "3x", r: "12+10+8" },
        { n: "Agachamento Sumo (M)", s: "4x", r: "12+10", tag: "isometria" },
        { n: "Flexora Vertical + câmbio", s: "3x", r: "12+10" },
        { n: "Mesa Flexora", s: "3x", r: "12+10+8" },
      ]},
      { title: "Panturrilha", exs: [
        { n: "Panturrilha no Leg 180", s: "4x", r: "20" },
        { n: "Panturrilha no Leg", s: "3x", r: "15" },
      ]},
    ]
  },
};

const AEROBIC = { when: "Após o treino", esteira: "10 a 15 min" };

// periodização: SEG=A TER=B QUA=C QUI=D SEX=A SAB/DOM=folga
const WEEKDAY_PLAN = { 1:"A", 2:"B", 3:"C", 4:"D", 5:"A" };
const WEEKDAY_NAMES = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const WEEKDAY_SHORT = ["dom","seg","ter","qua","qui","sex","sáb"];

const LOG_KEY = "treino_log_v1";
function loadLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; }catch(e){ return {}; } }
function saveLog(log){ localStorage.setItem(LOG_KEY, JSON.stringify(log)); }
function todayKey(d){ return d.toISOString().slice(0,10); }

let log = loadLog();
const now = new Date();
const tKey = todayKey(now);
const suggested = WEEKDAY_PLAN[now.getDay()] || null;
let currentLetter = suggested || "A";

function allExercises(letter){
  const list = [];
  DATA[letter].groups.forEach(g => g.exs.forEach(e => list.push(e.n)));
  return list;
}

function isDone(letter, name){
  return !!(log[tKey] && log[tKey][letter] && log[tKey][letter].includes(name));
}
function toggleDone(letter, name){
  if(!log[tKey]) log[tKey] = {};
  if(!log[tKey][letter]) log[tKey][letter] = [];
  const arr = log[tKey][letter];
  const i = arr.indexOf(name);
  if(i === -1) arr.push(name); else arr.splice(i,1);
  saveLog(log);
}
function clearToday(letter){
  if(log[tKey]) { log[tKey][letter] = []; saveLog(log); }
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  ["A","B","C","D"].forEach(letter => {
    const el = document.createElement("div");
    el.className = "tab" + (letter === currentLetter ? " active" : "");
    el.dataset.letter = letter;
    el.style.setProperty("--tab-color", `var(--${letter.toLowerCase()})`);
    el.innerHTML = `
      <span class="letter">${letter}</span>
      <span class="muscles">${DATA[letter].label.split(" · ")[0]}</span>
      ${letter === suggested ? '<span class="today-dot"></span>' : ''}
    `;
    el.addEventListener("click", () => { currentLetter = letter; renderAll(); });
    tabs.appendChild(el);
  });
}

function renderProgress(){
  const card = document.getElementById("progressCard");
  card.style.setProperty("--tab-color", `var(--${currentLetter.toLowerCase()})`);
  document.getElementById("progressRing").style.stroke = `var(--${currentLetter.toLowerCase()})`;
  document.getElementById("progressName").textContent = "TREINO " + currentLetter;
  document.getElementById("progressName").style.color = `var(--${currentLetter.toLowerCase()})`;

  const total = allExercises(currentLetter).length;
  const done = allExercises(currentLetter).filter(n => isDone(currentLetter, n)).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const circumference = 194.8;
  const offset = circumference - (pct/100)*circumference;
  document.getElementById("progressRing").style.strokeDashoffset = offset;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressCount").textContent = `${done} de ${total} concluídos`;
}

function renderExercises(){
  const wrap = document.getElementById("exerciseList");
  wrap.innerHTML = "";
  DATA[currentLetter].groups.forEach(group => {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<p class="group-title">${group.title}</p>`;
    group.exs.forEach(ex => {
      const done = isDone(currentLetter, ex.n);
      const row = document.createElement("div");
      row.className = "ex" + (done ? " done" : "");
      row.style.setProperty("--tab-color", `var(--${currentLetter.toLowerCase()})`);
      row.innerHTML = `
        <div class="checkbox">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#101214" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="ex-name">
          <div class="n ${done ? 'done-text' : ''}">${ex.n}</div>
          <div class="ex-meta">
            <span class="pill">${ex.s} ${ex.r}</span>
            ${ex.tag ? `<span class="pill">${ex.tag}</span>` : ''}
          </div>
        </div>
      `;
      row.addEventListener("click", () => {
        toggleDone(currentLetter, ex.n);
        renderAll();
      });
      g.appendChild(row);
    });
    wrap.appendChild(g);
  });

  const aer = document.createElement("div");
  aer.className = "aerobic-card";
  aer.innerHTML = `
    <span class="ic">🏃</span>
    <div><b>Aeróbico — ${AEROBIC.when}</b><span>Esteira: ${AEROBIC.esteira}</span></div>
  `;
  wrap.appendChild(aer);
}

function renderHistory(){
  const row = document.getElementById("historyRow");
  row.innerHTML = "";
  for(let i = 9; i >= 0; i--){
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    const key = todayKey(d);
    const dayLog = log[key];
    let letterDone = null;
    if(dayLog){
      for(const letter of ["A","B","C","D"]){
        if(dayLog[letter] && dayLog[letter].length >= Math.ceil(allExercises(letter).length * 0.6)){
          letterDone = letter;
        }
      }
    }
    const cell = document.createElement("div");
    cell.className = "hday" + (letterDone ? "" : " empty");
    cell.innerHTML = `
      <span class="dow">${WEEKDAY_SHORT[d.getDay()]}</span>
      <span class="mark" style="${letterDone ? `background:var(--${letterDone.toLowerCase()})` : ''}">${letterDone || '·'}</span>
    `;
    row.appendChild(cell);
  }
}

function renderHeader(){
  document.getElementById("todayLabel").textContent = WEEKDAY_NAMES[now.getDay()];
  document.getElementById("suggestLabel").textContent = suggested ? `treino sugerido: ${suggested}` : "dia de folga";
}

function renderAll(){
  renderTabs();
  renderProgress();
  renderExercises();
  renderHistory();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  clearToday(currentLetter);
  renderAll();
});

renderHeader();
renderAll();
</script>
</body>
</html>
